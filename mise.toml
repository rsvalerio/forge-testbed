# The tools forge's rust-ci installs for this repo (jdx/mise-action) to run `ops verify`
# and `ops qa`, and what developers get from `mise install`. Kept at forge's pins
# (forge docs/foundation.md).
[tool_alias]
ops = "github:rsvalerio/ops"
cargo-machete = "github:bnjbvr/cargo-machete"
cargo-edit = "cargo:cargo-edit"

[tools]
rust = { version = "1.98.0", components = "rustfmt,clippy" }
ops = "0.77.0"
cargo-deny = "0.20.2"
cargo-machete = "0.9.2"
cargo-edit = "0.13.13"
trivy = "0.70.0"
