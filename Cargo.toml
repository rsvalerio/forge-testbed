[workspace]
members = ["crates/*"]
resolver = "2"

# Inherited by every crate so `cargo publish` has the metadata it demands. A missing
# `license` or `description` fails publication late, during the release, which is exactly
# the class of surprise this repository exists to absorb.
[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rsvalerio/forge-testbed"
description = "Acceptance-test workspace for rsvalerio/forge's shared CI."
authors = ["Rodrigo Valerio"]

[workspace.dependencies]
# Internal deps carry BOTH a path and a version. crates.io rejects bare path
# dependencies, and a workspace that only ever builds locally never finds out —
# forge/docs/consuming.md lists this as a precondition all three real repos fail today.
testbed-core = { path = "crates/testbed-core", version = "0.1.1" }
