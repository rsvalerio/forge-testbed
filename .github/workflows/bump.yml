name: Bump

# Exercises four capabilities in one run: mint-app-token, app-bot-identity,
# signed-commit, and the tag + release dispatch. Three of the four bugs that reached ops's
# release pipeline lived on this path and would have surfaced here.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    if: ${{ github.repository_owner == 'rsvalerio' && github.event.workflow_run.conclusion == 'success' }}
    uses: rsvalerio/forge/.github/workflows/bump.yml@main
    with:
      branch: ${{ github.event.workflow_run.head_branch }}
      # Composite actions load from this ref too, so the testbed is not silently running
      # main's workflow against v1's actions.
      forge-ref: main
      release-workflow: release.yml
      app-client-id: ${{ vars.GH_APP_CLIENT_ID }}
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
